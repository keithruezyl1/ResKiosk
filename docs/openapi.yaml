openapi: 3.0.3
info:
  title: ResKiosk Hub API
  version: 0.1.0
  description: Offline-first disaster information system Hub API
paths:
  /health:
    get:
      summary: System health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /admin/ping:
    get:
      summary: Lightweight ping for connectivity checks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  hub_version:
                    type: string
                    example: '0.1'
  /network/info:
    get:
      summary: Get Hub network configuration
      responses:
        '200':
          description: Network Info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInfo'
  /kb/version:
    get:
      summary: Get current Knowledge Base version
      responses:
        '200':
          description: KB Version
          content:
            application/json:
              schema:
                type: object
                properties:
                  kb_version:
                    type: integer
                  updated_at:
                    type: integer
  /kb/snapshot:
    get:
      summary: Download full KB snapshot
      responses:
        '200':
          description: Full Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBSnapshot'
  /admin/article:
    post:
      summary: Create new KB article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KBArticleCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBArticle'
  /admin/article/{id}:
    put:
      summary: Update existing article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KBArticleUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBArticle'
    delete:
      summary: Delete article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
  /admin/config:
    get:
      summary: List system config keys
      responses:
        '200':
          description: Config list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StructuredConfig'
  /admin/config/{key}:
    get:
      summary: Get system config value
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Config value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredConfig'
    put:
      summary: Update system config value
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: object
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredConfig'
    delete:
      summary: Delete system config key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /query:
    post:
      summary: Submit user query
      description: Returns Phase 1 Placeholder (no retrieval yet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'

  /admin/kb/assets:
    post:
      summary: Upload a KB image asset (admin)
      description: >-
        Accepts a multipart image (png/jpeg/webp). Stores the original + a
        deterministic thumbnail and display rendition (content-addressed), and
        creates a `ready` ImageAsset. Invalid type/size → 400 (rejected);
        undecodable → 422 (failed). Optional `kb_item_id` links the asset to a
        KB image item.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                kb_item_id:
                  type: integer
                  nullable: true
      responses:
        '200': { description: Asset stored (ready) }
        '400': { description: Rejected (unsupported mime / too large) }
        '422': { description: Failed (undecodable / too many pixels) }
    get:
      summary: List image assets + status (admin)
      responses:
        '200': { description: Array of asset status objects }
  /admin/kb/assets/{id}:
    get:
      summary: Get one image asset's status/metadata (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Asset status object }
        '404': { description: Not found }
  /assets/{id}/{variant}:
    get:
      summary: Serve an image asset variant to the kiosk
      description: >-
        Returns the file for variant `thumb` | `display` | `original`, but ONLY
        if the asset is `ready` (4-state gate). pending/failed/rejected/missing
        all return 404. This is the URL shape used by QueryResponse.render_ref.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: variant, in: path, required: true, schema: { type: string, enum: [thumb, display, original] } }
      responses:
        '200': { description: Image bytes (image/webp for thumb/display) }
        '404': { description: Not available / not found }

components:
  schemas:
    NetworkInfo:
      type: object
      properties:
        ip:
          type: string
        port:
          type: integer
    KBArticle:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        answer:
          type: string
        category:
          type: string
        tags:
          type: string # JSON string as per requirement, or array? Spec says "JSON string" in DB, usually list in API. Let's use List[str] in API and serialize in DB. Wait, prompt says "tags (JSON string)" for DB. API usually returns structured. Let's return List[str].
          # Actually, prompts says "tags (JSON string)" under DB fields. For API it implies standard JSON.
        status:
          type: string
          enum: [draft, published]
        enabled:
          type: boolean
        created_at:
          type: integer
        last_updated:
          type: integer
    KBArticleCreate:
      type: object
      required:
        - question
        - answer
        - category
      properties:
        question:
          type: string
        answer:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, published]
        enabled:
          type: boolean
    KBArticleUpdate:
      type: object
      properties: # All optional
        question:
          type: string
        answer:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
        enabled:
          type: boolean
    StructuredConfig:
      type: object
      properties:
        key:
          type: string
        value:
          type: object # Any JSON
        updated_at:
          type: string
          format: date-time
    KBSnapshot:
      type: object
      properties:
        kb_version:
          type: integer
        articles:
          type: array
          items:
            $ref: '#/components/schemas/KBArticle'
        structured_config:
          type: object # Map of key -> value
    QueryRequest:
      type: object
      required:
        - center_id
        - kiosk_id
        - transcript_original
        - language
      properties:
        center_id:
          type: string
        kiosk_id:
          type: string
        transcript_original:
          type: string
        transcript_english:
          type: string
        language:
          type: string
        kb_version:
          type: integer
    QueryResponse:
      type: object
      properties:
        answer_text_en:
          type: string
        answer_type:
          type: string
        confidence:
          type: number
        kb_version:
          type: integer
        clarification_categories:
          type: array
          items:
            type: string
          nullable: true
        follow_up_prompt:
          type: string
          nullable: true
        follow_up_intent:
          type: string
          nullable: true
        secondary_evidence:
          $ref: '#/components/schemas/SecondaryEvidence'
          nullable: true
        sos_offered:
          type: boolean
          default: false
    SecondaryEvidence:
      type: object
      description: >-
        Phase 4 / Slice 5 — best evidence from the non-primary retrieval path of
        a compound query, so safety/medical sub-intents are not buried.
      properties:
        intent:
          type: string
        source_id:
          type: integer
          nullable: true
        answer_text:
          type: string
          nullable: true
        confidence:
          type: number
          nullable: true
